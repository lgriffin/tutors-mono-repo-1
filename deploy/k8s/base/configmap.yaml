apiVersion: v1
kind: ConfigMap
metadata:
  name: tutors-app-config
  labels:
    app.kubernetes.io/part-of: tutors
data:
  # Public URL metadata used to render the Route/Ingress host.
  # Kit 3 derives the request origin from the trusted proxy headers below.
  TUTORS_ORIGIN: "https://tutors.dev"
  # Cross-app links. Public dynamic env is read by SvelteKit at runtime.
  PUBLIC_READER_ORIGIN: "https://tutors.dev"
  PUBLIC_CATALOGUE_ORIGIN: "https://catalogue.tutors.dev"
  PUBLIC_LIVE_ORIGIN: "https://live.tutors.dev"
  PUBLIC_TIME_ORIGIN: "https://time.tutors.dev"
  # Trust the proxy headers set by the OpenShift router / ingress controller.
  PROTOCOL_HEADER: "x-forwarded-proto"
  HOST_HEADER: "x-forwarded-host"
  ADDRESS_HEADER: "x-forwarded-for"
  XFF_DEPTH: "1"
  # Application settings (see .env.example). Set per environment.
  # The reader and time servers keep student data in Postgres (PRIVATE_DATABASE_URL), and the
  # reader and live servers carry realtime over Valkey (PRIVATE_VALKEY_URL), both from the
  # app's secret.
  PUBLIC_ANON_MODE: ""
  PUBLIC_PDF_KEY: ""
  LOG_LEVEL: "info"
  # Tutors Live. Where the reader posts events; empty disables the emitter.
  PUBLIC_LIVE_EVENTS_URL: ""
  # Pipeline adapters: memory | redis, memory | valkey, memory | postgres.
  # All empty means the memory pipeline, which needs no broker and no database.
  LIVE_BUS: ""
  LIVE_HOT_STORE: ""
  LIVE_WAREHOUSE: ""
  LIVE_REDIS_URL: ""
  LIVE_DATABASE_URL: ""
  LIVE_RETENTION_DAYS: "90"
  # Whether the live app also runs the ingest consumer. Empty follows the bus.
  LIVE_INGEST_IN_PROCESS: ""
  # Term windows for the out-of-term observation, as JSON.
  LIVE_TERMS: ""
