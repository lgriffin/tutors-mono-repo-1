apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: live-

labels:
  - pairs:
      app.kubernetes.io/name: tutors-live
      app.kubernetes.io/component: live
    includeSelectors: true
    includeTemplates: true

images:
  - name: tutors-app
    newName: quay.io/tutors-sdk/tutors-live
    newTag: "17.0.0"
    digest: sha256:52740e55cfa7e7db3b2944137caada4e876990b937f1034c0c5e79796054f8a0

patches:
  - target:
      kind: ConfigMap
      name: tutors-app-config
    patch: |
      - op: replace
        path: /data/TUTORS_ORIGIN
        value: "https://live.tutors.dev"
      # Every read goes through the reader's data API; the reader lists this origin in
      # PRIVATE_API_ALLOWED_ORIGINS so error reports and Live watcher reports pass.
      - op: add
        path: /data/PUBLIC_READER_URL
        value: "https://tutors.dev"
