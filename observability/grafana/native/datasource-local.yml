# Literal (no env vars) Postgres data source for a NATIVELY-installed Grafana
# pointed at the local Postgres store (`docker compose --profile store-postgres up`). Symlink this into Grafana's
# provisioning dir (see README "Quick start — native Grafana"):
#
#   sudo ln -s "$PWD/native/datasource-local.yml" \
#     /etc/grafana/provisioning/datasources/tutors.yml
#
# Native Grafana reaches the host directly, so localhost is correct here.
# For staging, add a data source through the Grafana UI (keep creds out of git).
apiVersion: 1

datasources:
  - name: Tutors Local
    uid: tutors-local
    type: postgres
    access: proxy
    url: localhost:5433
    user: tutors
    isDefault: true
    jsonData:
      database: tutors
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: tutors
    editable: true
