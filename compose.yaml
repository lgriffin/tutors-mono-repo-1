# Local stack: builds and runs all four apps from this checkout.
#
#   docker compose up --build            # all apps
#   docker compose up --build reader proxy # just one
#
# Runtime configuration comes from an optional .env file in the repo root
# (see .env.example). With no .env the apps start in anonymous mode.
# Host ports default to 3000-3003; override with READER_PORT, CATALOGUE_PORT,
# LIVE_PORT or TIME_PORT if one is already taken.
#
# Images are tagged tutors/<app>:local. To build, push or run them under their
# published names instead, set the repository prefix and the tag:
#
#   export TUTORS_IMAGE_PREFIX=quay.io/tutors-sdk/tutors- TUTORS_TAG=16.2.2
#   docker compose build && docker compose push      # publish by hand
#   docker compose pull && docker compose up --no-build   # run what was published
name: tutors

# Stamped into the OCI labels; all optional.
x-build-args: &build-args
  VERSION: ${TUTORS_TAG:-local}
  GIT_SHA: ${GIT_SHA:-unknown}
  BUILD_DATE: ${BUILD_DATE:-unknown}

x-app: &app
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/healthz/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  proxy:
    image: docker.io/library/caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    # The official Caddy binary carries a file capability and needs it in the bounding set to execute.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /data:uid=1001,gid=1001
      - /config:uid=1001,gid=1001
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${READER_PORT:-3000}:3000"
      - "${CATALOGUE_PORT:-3001}:3001"
      - "${LIVE_PORT:-3002}:3002"
      - "${TIME_PORT:-3003}:3003"

  reader:
    <<: *app
    image: ${TUTORS_IMAGE_PREFIX:-tutors/}reader:${TUTORS_TAG:-local}
    build:
      context: .
      args:
        <<: *build-args
        APP_NAME: reader
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PUBLIC_ANON_MODE: ${PUBLIC_ANON_MODE:-TRUE}
      # Unset, the store is Supabase. The `store-postgres` profile serves plain
      # Postgres: DATA_STORE=postgres PRIVATE_DATABASE_URL=postgres://tutors:tutors@postgres:5432/tutors
      DATA_STORE: ${DATA_STORE:-}
      PRIVATE_DATABASE_URL: ${PRIVATE_DATABASE_URL:-}

  catalogue:
    <<: *app
    image: ${TUTORS_IMAGE_PREFIX:-tutors/}catalogue:${TUTORS_TAG:-local}
    build:
      context: .
      args:
        <<: *build-args
        APP_NAME: catalogue
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PUBLIC_ANON_MODE: ${PUBLIC_ANON_MODE:-TRUE}

  live:
    <<: *app
    image: ${TUTORS_IMAGE_PREFIX:-tutors/}live:${TUTORS_TAG:-local}
    build:
      context: .
      args:
        <<: *build-args
        APP_NAME: live
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PUBLIC_ANON_MODE: ${PUBLIC_ANON_MODE:-TRUE}
      # Unset, these default to the memory pipeline: one container, no broker,
      # no database, a working dashboard. The `live-pipeline` profile below sets
      # them to the networked adapters.
      LIVE_BUS: ${LIVE_BUS:-}
      LIVE_HOT_STORE: ${LIVE_HOT_STORE:-}
      LIVE_WAREHOUSE: ${LIVE_WAREHOUSE:-}
      LIVE_REDIS_URL: ${LIVE_REDIS_URL:-}
      LIVE_DATABASE_URL: ${LIVE_DATABASE_URL:-}
      LIVE_TERMS: ${LIVE_TERMS:-}

  # The full pipeline, off by default:
  #
  #   docker compose --profile live-pipeline up --build
  #
  # brings up Valkey, TimescaleDB and the ingest consumer. Point the live app at
  # them with LIVE_BUS=redis LIVE_HOT_STORE=valkey LIVE_WAREHOUSE=postgres and
  # the two URLs below.
  valkey:
    profiles: ["live-pipeline"]
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  timescaledb:
    profiles: ["live-pipeline"]
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${LIVE_DB_USER:-tutors}
      POSTGRES_PASSWORD: ${LIVE_DB_PASSWORD:-tutors}
      POSTGRES_DB: ${LIVE_DB_NAME:-tutorslive}
    ports:
      - "${LIVE_DB_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIVE_DB_USER:-tutors} -d ${LIVE_DB_NAME:-tutorslive}"]
      interval: 10s
      timeout: 3s
      retries: 5

  live-ingest:
    profiles: ["live-pipeline"]
    image: tutors/live-ingest:local
    build:
      context: .
      dockerfile: services/live-ingest/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    environment:
      PORT: 3010
      LIVE_BUS: redis
      LIVE_HOT_STORE: valkey
      LIVE_WAREHOUSE: postgres
      LIVE_REDIS_URL: redis://valkey:6379
      LIVE_DATABASE_URL: postgres://${LIVE_DB_USER:-tutors}:${LIVE_DB_PASSWORD:-tutors}@timescaledb:5432/${LIVE_DB_NAME:-tutorslive}
    ports:
      - "${LIVE_INGEST_PORT:-3010}:3010"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/healthz/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Plain Postgres for the reader's and time's student data, off by default:
  #
  #   docker compose --profile store-postgres up --build
  #
  # applies db/migrations on first start. Point the reader and time at it with
  # DATA_STORE=postgres and the URL below (from the host, port 5433). Later
  # migrations: PRIVATE_DATABASE_URL=postgres://tutors:tutors@localhost:5433/tutors pnpm db:migrate
  postgres:
    profiles: ["store-postgres"]
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${STORE_DB_USER:-tutors}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD:-tutors}
      POSTGRES_DB: ${STORE_DB_NAME:-tutors}
    ports:
      - "${STORE_DB_PORT:-5433}:5432"
    volumes:
      - store-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORE_DB_USER:-tutors} -d ${STORE_DB_NAME:-tutors}"]
      interval: 10s
      timeout: 3s
      retries: 5

  time:
    <<: *app
    image: ${TUTORS_IMAGE_PREFIX:-tutors/}time:${TUTORS_TAG:-local}
    build:
      context: .
      args:
        <<: *build-args
        APP_NAME: time
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PUBLIC_ANON_MODE: ${PUBLIC_ANON_MODE:-TRUE}
      # Unset, the store is Supabase. The `store-postgres` profile serves plain
      # Postgres: DATA_STORE=postgres PRIVATE_DATABASE_URL=postgres://tutors:tutors@postgres:5432/tutors
      DATA_STORE: ${DATA_STORE:-}
      PRIVATE_DATABASE_URL: ${PRIVATE_DATABASE_URL:-}

volumes:
  timescale-data:
  store-data:
